name: Veracode sandbox Scan

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write

on:
  push:
    branches:
      - develop


jobs:
  checkout-and-package:
    runs-on: windows-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            ./
            !node_modules/
            !.git/
            !.github/


  sandbox-scan:
    needs: checkout-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: source
          path: workspace

      - name: Crear carpeta de salida
        run: mkdir -p workspace/output

      - name: Zip build output (excluyendo node_modules, .git, .github)
        run: |
          cd workspace
          zip -r output/build.zip . -x "node_modules/*" ".git/*" ".github/*" "output/*"

      - name: Debug build output
        run: |
          ls -R ./workspace/output/

      - name: Sandbox Scan en Veracode
        uses: veracode/veracode-uploadandscan-action@0.2.8
        with:
          appname: 'verademo-javascript-api-2'
          createprofile: true
          createsandbox: true
          sandboxname: 'Sandbox-Develop'
          filepath: ./workspace/output/build.zip
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          scantimeout: 1200
